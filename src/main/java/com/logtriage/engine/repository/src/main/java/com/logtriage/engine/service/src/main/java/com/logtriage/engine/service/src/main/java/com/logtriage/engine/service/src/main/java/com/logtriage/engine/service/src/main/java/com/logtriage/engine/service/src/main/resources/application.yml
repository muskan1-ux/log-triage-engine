server:
  port: 8080

spring:
  application:
    name: log-triage-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logtriage}
    username: ${DB_USER:logtriage}
    password: ${DB_PASSWORD:logtriage}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  kafka:
    consumer-group: log-triage-engine
    listener-concurrency: 6
    topics:
      raw-logs: logs.raw.v1
      dlq: logs.dlq.v1

langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY:demo}
    model-name: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-seconds: 4

resilience4j:
  circuitbreaker:
    instances:
      logTriage:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      logTriage:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.logtriage.engine.exception.NonRetryableProcessingException

  timelimiter:
    instances:
      logTriage:
        timeout-duration: 4s
        cancel-running-future: true

  bulkhead:
    instances:
      logTriage:
        max-concurrent-calls: 20
        max-wait-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.logtriage.engine: INFO
    org.apache.kafka: WARN
